<script>
    function buscarDados() {
        let nomeDaBusca = ipt_usuario.value;
        let emailDaBusca = ipt_email_usuario.value;
        let empresadoFuncionario = sessionStorage.ID_EMPRESA;

        if (nomeDaBusca == "" || emailDaBusca == "") {
            alert("Por favor, digite um nome e um email para buscar.");
            return;
        }

        fetch(`/avisos/buscarDados?nome=${nomeDaBusca}&email=${emailDaBusca}&fkEmpresa=${empresadoFuncionario}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
            },
        })
            .then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (dados) {
                        console.log("Funcionário encontrado:", dados);

                        ipt_nome.value = dados.nome;
                        ipt_email.value = dados.email;
                        ipt_telefone.value = dados.telefone;
                        ipt_cargo.value = dados.cargo;
                        ipt_codigo.value = dados.id_funcionario;
                        ipt_situacao_funcionario.value = dados.ativo ? "Ativo" : "Inativo";
                    });
                } else {
                    console.error("Funcionário não encontrado ou erro no servidor.");
                    alert("Funcionário não encontrado.");
                }
            })
            .catch(function (erro) {
                console.error("Erro de rede:", erro);
            });
    }

    function editar() {
        let idFuncionario = ipt_codigo.value;
        let empresadoFuncionario = sessionStorage.ID_EMPRESA;

        if (!idFuncionario) {
            alert("Pesquise um usuário antes de tentar modificar.");
            return;
        }

        fetch(`/avisos/editar/${idFuncionario}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                codigo: ipt_codigo.value,
                nome: ipt_nome.value,
                email: ipt_email.value,
                telefone: ipt_telefone.value,
                cargo: ipt_cargo.value,
                situacao_funcionario: ipt_situacao_funcionario.value === "Ativo" ? 1 : 0,
                fkEmpresa: empresadoFuncionario
            })
        }).then(function (resposta) {

            if (resposta.ok) {
                console.log("Post atualizado com sucesso pelo usuario de email: " + sessionStorage.getItem("email_Funcionario") + "!");
                window.location = "/dashboard/gerenciarUsuario.html"
            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
        });
    }


    // deleta a pessoa?
function desativar() {
    let idFuncionario = ipt_codigo.value;
    let empresadoFuncionario = sessionStorage.ID_EMPRESA;

    if (!idFuncionario) {
        alert("Pesquise um usuário antes de tentar desativar.");
        return;
    }
    
    console.log("ID capturado no clique do botão:", idFuncionario);

        fetch(`/avisos/desativar/${idFuncionario}?fkEmpresa=${empresadoFuncionario}`, {
            method: "PUT",
            // method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            }
        }).then(function (resposta) {

            if (resposta.ok) {
                console.log("Post deletado com sucesso pelo usuario de email: " + sessionStorage.getItem("email_Funcionario") + "!");
                window.location = "/dashboard/gerenciarUsuario.html"
            } else if (resposta.status == 404) {
                window.alert("Deu 404!");
            } else {
                throw ("Houve um erro ao tentar realizar a postagem! Código da resposta: " + resposta.status);
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
        });
    }

     let listaFuncionariosCadastrados = [];

  function listarFuncionarios() {
    let fkEmpresa = sessionStorage.ID_EMPRESA;

    fetch(`/avisos/listarFuncionarios/${fkEmpresa}`, {
      method: "GET",
    })
      .then(function (resposta) {
        if (resposta.ok) {
          if (resposta.status == 204) {
            console.log("Nenhum funcionário encontrado.");
            return;
          }

          resposta.json().then((funcionarios) => {
            console.log("Funcionários recebidos do servidor:", funcionarios);

            listaFuncionariosCadastrados = [];

            funcionarios.forEach((funcionario) => {
              let dadosSimplificados = {
                id: funcionario.id_funcionario,
                nome: funcionario.nome,
                email: funcionario.email
              };

              listaFuncionariosCadastrados.push(dadosSimplificados);
            });


            //pega só o is, nome e email dos funcionarios
            div_mensagem.innerHTML = "";

            if (listaFuncionariosCadastrados.length > 0) {
              for (let i = 0; i < listaFuncionariosCadastrados.length; i++) {
                div_mensagem.innerHTML += `
                    <b>ID:</b> ${listaFuncionariosCadastrados[i].id}<br>
                    <b>Nome:</b> ${listaFuncionariosCadastrados[i].nome}<br>
                    <b>E-mail:</b> ${listaFuncionariosCadastrados[i].email}<br><br>
                `;
              }
            } else {
              div_mensagem.innerHTML = "Nenhum funcionário cadastrado para exibir.";
            }
          });
        } else {
          console.error("Erro na resposta do servidor. Status:", resposta.status);
        }
      })
      .catch(function (erro) {
        console.error(`#ERRO na requisição: ${erro}`);
      });
  }

</script>
