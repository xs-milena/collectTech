    <div class="sidebar">
        <div>
            <div class="logoSide">
                <img src="../assets/img/broto.png">
                <h1>Collect Tech</h1>
                <p>Smart City Solution</p>
                <div class="linha"></div>
            </div>
            <ul class="menu">
                <a href="./dashboard.html">
                    <li class="ativo">Geral</li>
                </a>
                <a href="./dashboard-pg2.html">
                    <li>Lixeiras</li>
                </a>

                    <li>Mapa</li>
                </a>
                <a href="../cadastro.html">

                <a href="./gerenciarUsuario.html">

                </a>
                <a href="https://collectech.atlassian.net/servicedesk/customer/portal/2">

                </a>

        </div>
        <div id="sair">
            <span class="material-icons">logout</span>
            <span class="link"><a href="./index.html">Sair</a></span>
        </div>
    </div>
    <div class="graficos">
        <div class="grafico-e-kpi">
            <div class="container2">
                <div class="kpi">
                    <div class="box_lixeiras total">
                        <div id="total_lixeiras">

                        </div>
                        <div class="container_icone icone_total">
                            <img src="../assets/img/lixeira.png" class="icone_box">
                        </div>
                    </div>
                    <div class="box_lixeiras cheia">
                        <div id="total_lixeiras_alto">

                        </div>
                        <div class="container_icone icone_cheia">
                            <img src="../assets/img/triste.png" class="icone_box">
                        </div>
                    </div>
                </div>

                <div class="kpi">
                    <div class="box_lixeiras medio">
                        <div id="total_lixeiras_medio">

                        </div>
                        <div class="container_icone icone_medio">
                            <img src="../assets/img/feliz.png" class="icone_box">
                        </div>
                    </div>

                    <div class="box_lixeiras vazia">
                        <div id="total_lixeiras_baixo">

                        </div>
                        <div class="container_icone icone_vazia">
                            <img src="../assets/img/sorrindo.png" class="icone_box">
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <div class="container5">
            <div id="topo">
                <select name="" id="select_bairros" class="select"></select>
                <h3>Bairros</h3>
                <div class="barra-pesquisa">
                    <input type="text">
                    <img src="../assets/img/pesquisa.png" alt="">
                </div>
            </div>
            <div id="roscas"></div>
        </div>

        <table id="tabela_ecopontos" class="tabela_ecopontos">
            <thead>
                <tr>
                    <th>Ecoponto</th>
                    <th>Código</th>
                    <th>Nivel</th>
                    <th>Hora da captura do dado</th>
                    <th>Data da captura do dado</th>
                </tr>
            </thead>
            <tbody id="corpo_tabela">
            </tbody>
        </table>
    </div>

</body>

    let id_empresa = sessionStorage.ID_EMPRESA;

    window.onload = totalLixeiras(id_empresa);

    function totalLixeiras() {
        fetch(`/ecopontos/totalLixeiras/${id_empresa}`).then(function (res) {
            if (res.ok) {
                res.json().then(function (dados) {
                    let total = document.getElementById("total_lixeiras");
                    let totalA = document.getElementById("total_lixeiras_alto");
                    let totalM = document.getElementById("total_lixeiras_medio");
                    let totalB = document.getElementById("total_lixeiras_baixo");

                    for (let i = 0; i < dados.length; i++) {
                        let linha = dados[i];
                        // cria a linha da tabela com os dados do banco
                        total.innerHTML = `
                       <p> Total de lixeiras:</p>
                            <h3 id="lixo_total">${linha.total}</h3>
                            <h6>no sistema</h6>
                    `;

                        totalA.innerHTML = `
                       <p> Nivel Alto:</p>
                            <h3 id="lixo_alto">${linha.total_nivel_cheia}</h3>
                            <h6>80%+ cheias</h6>
                    `;

                        totalM.innerHTML = `
                       <p> Nivel Médio:</p>
                            <h3 id="lixo_medio">${linha.total_nivel_medio}</h3>
                            <h6>50-80% cheias</h6>
                    `;

                        totalB.innerHTML = `
                       <p> Nivel Baixo:</p>
                            <h3 id="lixo_baixo">${linha.total_nivel_baixo}</h3>
                            <h6>0-50% cheias</h6>
                    `;
                    }
                });
            }
        });
    }



    ///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////


    window.onload = listarEcoponto(id_empresa);
    console.log(id_empresa);

    function listarEcoponto() {
        fetch(`/ecopontos/listarEcoponto/${id_empresa}`).then(function (res) {

    function atualizarGrafico(id_quiz, dados, myChart) {



        fetch(`/medidas/tempo-real/${id_quiz}`, { cache: 'no-store' }).then(function (response) {
            if (response.ok) {
                response.json().then(function (novoRegistro) {

                    obterdados(id_quiz);
                    // alertar(novoRegistro, id_quiz);
                    console.log(`Dados recebidos: ${JSON.stringify(novoRegistro)}`);
                    console.log(`Dados atuais do gráfico:`);
                    console.log(dados);

                    let avisoCaptura = document.getElementById(`avisoCaptura${id_quiz}`)
                    avisoCaptura.innerHTML = ""


                    if (novoRegistro[0].cadastrado_em == dados.labels[dados.labels.length - 1]) {
                        console.log("---------------------------------------------------------------")
                        console.log("Como não há dados novos para captura, o gráfico não atualizará.")
                        avisoCaptura.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> Foi trazido o dado mais atual capturado pelo sensor. <br> Como não há dados novos a exibir, o gráfico não atualizará."
                        console.log("Horário do novo dado capturado:")
                        console.log(novoRegistro[0].cadastrado_em)
                        console.log("Horário do último dado capturado:")
                        console.log(dados.labels[dados.labels.length - 1])
                        console.log("---------------------------------------------------------------")
                    } else {
                        // tirando e colocando valores no gráfico
                        dados.labels.shift(); // apagar o primeiro
                        dados.labels.push(novoRegistro[0].cadastrado_em); // incluir um novo momento

                        dados.datasets[0].data.shift();  // apagar o primeiro de umidade
                        dados.datasets[0].data.push(novoRegistro[0].pontuacao_matematica); // incluir uma nova medida de umidade

                        dados.datasets[1].data.shift();  // apagar o primeiro de temperatura
                        dados.datasets[1].data.push(novoRegistro[0].pontuacao_serie); // incluir uma nova medida de temperatura

                        myChart.update();
                    }

                    // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                    proximaAtualizacaoFacil = setTimeout(() => atualizarGrafico(id_quiz, dados, myChart), 2000);
                });
            } else {
                console.error('Nenhum dado encontrado ou erro na API');
                // Altere aqui o valor em ms se quiser que o gráfico atualize mais rápido ou mais devagar
                proximaAtualizacaoFacil = setTimeout(() => atualizarGrafico(id_quiz, dados, myChart), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }

                proximaAtualizacaoDificil = setTimeout(() => atualizarGrafico(id_quiz, dados, myChart3), 2000);
            }
        })
            .catch(function (error) {
                console.error(`Erro na obtenção dos dados p/ gráfico: ${error.message}`);
            });

    }
